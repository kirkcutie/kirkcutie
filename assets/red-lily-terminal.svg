    <path d="M64 56C20 50 14 86 44 78M64 56C108 50 114 86 84 78" stroke="#bb0a1e">
      <animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
    </path>
    <g fill="#ff5365" stroke="none">
      <rect x="25" y="34" width="7" height="7"/>
      <rect x="96" y="34" width="7" height="7"/>
      <rect x="31" y="55" width="7" height="7"/>
      <rect x="90" y="55" width="7" height="7"/>
      <rect x="42" y="76" width="7" height="7"/>
      <rect x="79" y="76" width="7" height="7"/>
      <animate attributeName="opacity" values=".35;1;.35" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="20">
    <text x="230" y="78" fill="#7cffd4">$ nmap --profile kirkcutie</text>
    <text x="230" y="112" fill="#f4f6f8">open ports: recon, web-security, labs, reports</text>
