<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Animated red spider lily terminal">
  <rect width="900" height="180" rx="18" fill="#07090d"/>
  <rect x="1" y="1" width="898" height="178" rx="17" fill="none" stroke="#3a0b12"/>
  <path d="M0 44h900" stroke="#231015"/>
  <circle cx="28" cy="22" r="6" fill="#bb0a1e"/>
  <circle cx="50" cy="22" r="6" fill="#7a0015"/>
  <circle cx="72" cy="22" r="6" fill="#2a2f38"/>

  <g transform="translate(52 64)" fill="none" stroke-linecap="square" stroke-width="4">
    <path d="M64 82V34" stroke="#bb0a1e"/>
    <path d="M64 42C30 6 6 20 28 38M64 42C98 6 122 20 100 38" stroke="#d0182b">
      <animate attributeName="stroke-opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M64 48C18 18 4 52 34 58M64 48C110 18 124 52 94 58" stroke="#ff324a">
      <animate attributeName="stroke-opacity" values="1;.35;1" dur="2.7s" repeatCount="indefinite"/>
