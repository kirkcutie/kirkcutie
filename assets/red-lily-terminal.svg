  </rect>

  <g opacity=".22">
    <path d="M700 56h126M700 84h126M700 112h126M700 140h126M700 56v84M728 56v84M756 56v84M784 56v84M812 56v84" stroke="#bb0a1e"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 14 0; 0 0" dur="5s" repeatCount="indefinite"/>
  </g>
